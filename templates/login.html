{% extends "base.html" %}
{% block title %}FNCCR — Connexion{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card">
        <h2>Connexion</h2>
        <p class="login-subtitle">Renseignez votre adresse email pour accéder à l'application.</p>

        <form method="post" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" required placeholder="prenom.nom@exemple.fr" autofocus>
            </div>
            <div class="btn-group" style="justify-content: center; margin-top: 1.25rem;">
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
