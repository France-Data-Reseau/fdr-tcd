{% extends "base.html" %}
{% block title %}FNCCR — Nouveau document{% endblock %}

{% block content %}
<a href="/projet/{{ projet_id }}?collectivite_id={{ collectivite_id }}" class="btn-back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Retour au projet
</a>

<div class="card">
    <h2>Nouveau document</h2>

    <form method="POST" action="/projet/{{ projet_id }}/document/nouveau">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="collectivite_id" value="{{ collectivite_id }}">

        <div class="form-group">
            <label for="titre">Titre</label>
            <input type="text" id="titre" name="titre" required>
        </div>

        <div class="form-group">
            <label for="en_ligne">Lien en ligne</label>
            <input type="url" id="en_ligne" name="en_ligne">
        </div>

        <div class="form-group">
            <label for="type">Type</label>
            <input type="text" id="type" name="type">
        </div>

        <div class="btn-group">
            <button type="submit" name="action" value="retour" class="btn btn-primary">Enregistrer et retourner au projet</button>
            <button type="submit" name="action" value="autre" class="btn btn-accent">Enregistrer et ajouter un autre</button>
        </div>
    </form>
</div>
{% endblock %}
