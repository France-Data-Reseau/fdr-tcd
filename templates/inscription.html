{% extends "base.html" %}
{% block title %}FNCCR — Inscription{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card">
        <h2>Demande d'accès</h2>
        <p class="login-subtitle">Votre adresse email n'est pas encore enregistrée. Remplissez le formulaire ci-dessous pour demander un accès.</p>

        <form method="post" action="/inscription">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="Prenom">Prénom</label>
                    <input type="text" id="Prenom" name="Prenom" required placeholder="Prénom">
                </div>
                <div class="form-group">
                    <label for="Nom">Nom</label>
                    <input type="text" id="Nom" name="Nom" required placeholder="Nom">
                </div>
            </div>

            <div class="form-group">
                <label for="Email">Adresse email</label>
                <input type="email" id="Email" name="Email" required value="{{ prefill_email or '' }}" placeholder="prenom.nom@exemple.fr">
            </div>

            <div class="form-group">
                <label for="Collectivite">Collectivité</label>
                <select id="Collectivite" name="Collectivite">
                    <option value="0">-- Sélectionner une collectivité --</option>
                    {% for coll in collectivites %}
                    <option value="{{ coll.id }}">{{ coll.fields.nom }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="Organisation">Organisation</label>
                <input type="text" id="Organisation" name="Organisation" placeholder="Nom de votre organisation (optionnel)">
            </div>

            <div class="btn-group" style="justify-content: center; margin-top: 1.25rem;">
                <button type="submit" class="btn btn-primary">Envoyer la demande</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 1rem;">
            <a href="/login" style="font-size: 0.85rem; color: var(--gray-500);">Retour à la connexion</a>
        </div>
    </div>
</div>
{% endblock %}
