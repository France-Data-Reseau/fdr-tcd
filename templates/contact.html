{% extends "base.html" %}
{% block title %}FNCCR — Nouveau contact{% endblock %}

{% block content %}
<a href="/projet/{{ projet_id }}?collectivite_id={{ collectivite_id }}" class="btn-back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Retour au projet
</a>

<div class="card">
    <h2>Nouveau contact</h2>

    {% if collectivite_nom %}
    <div class="form-group">
        <label>Collectivité</label>
        <div class="readonly-info">{{ collectivite_nom }}</div>
    </div>
    {% endif %}

    <form method="POST" action="/projet/{{ projet_id }}/contact/nouveau">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="collectivite_id" value="{{ collectivite_id }}">

        <div class="form-row">
            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" required>
            </div>
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" required>
            </div>
        </div>

        <div class="form-check">
            <input type="checkbox" id="elu_e" name="elu_e" value="1">
            <label for="elu_e">Élu·e</label>
        </div>

        <div class="form-group">
            <label for="fonction">Fonction</label>
            <input type="text" id="fonction" name="fonction">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone">
            </div>
            <div class="form-group">
                <label for="mobile">Mobile</label>
                <input type="tel" id="mobile" name="mobile">
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" name="action" value="retour" class="btn btn-primary">Enregistrer et retourner au projet</button>
            <button type="submit" name="action" value="autre" class="btn btn-accent">Enregistrer et ajouter un autre</button>
        </div>
    </form>
</div>
{% endblock %}
