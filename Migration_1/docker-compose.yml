# Stack autonome pour migrer l'app Formulaire FNCCR sur un nouveau serveur.
# Domaine cible : tcd.francedatareseau.fr
#
# Deux services : `tcd` (l'app FastAPI) + `caddy` (reverse proxy + TLS Let's Encrypt).
# L'app est SANS ÉTAT : aucune base locale, toutes les données vivent dans le
# Grist externe (grist.francedatareseau.fr). Rien à sauvegarder côté app.
#
# Build context = .. (le dossier de l'app, parent de Migration_1).
# → Copier TOUT le dossier app_form_fnccr (qui contient Migration_1) sur le serveur,
#   puis lancer depuis l'intérieur de Migration_1 :  docker compose up -d --build
#
# Si le serveur a DÉJÀ un reverse proxy (Caddy/nginx/Traefik), voir MIGRATION.md
# section « Option B » : ne garder que le service `tcd` et router le proxy existant
# vers tcd:8000 (supprimer le service caddy ci-dessous).

services:
  tcd:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tcd
    restart: unless-stopped
    env_file: ./.env
    environment:
      - ENVIRONMENT=production
    networks: [tcd_net]
    # Pas de `ports:` → l'app n'est jamais exposée directement, seulement via Caddy.

  caddy:
    image: caddy:2-alpine
    container_name: tcd_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - LE_EMAIL=${LE_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks: [tcd_net]

networks:
  tcd_net:
    driver: bridge
