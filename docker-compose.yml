services:
  app:
    image: ghcr.io/france-data-reseau/fdr-tcd:${FDR_APP_TAG:-staging}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - GRIST_API_KEY=${GRIST_API_KEY}
      - GRIST_DOC_ID=${GRIST_DOC_ID}
      - GRIST_SERVER_URL=${GRIST_SERVER_URL}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REQUIRE_EMAIL_VERIFIED=True
      - SECRET_KEY=${SECRET_KEY}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 20s
    # MONO-WORKER: cache memoire + rate limiting reposent sur 1 process.
    # Le CMD du Dockerfile n'utilise volontairement PAS --workers.

# For development with hot-reload and port binding, use:
# docker-compose -f docker-compose.yml -f docker-compose.dev.yml up